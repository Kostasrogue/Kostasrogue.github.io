<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kostas Papageorgiou · Apps</title>
<meta name="description" content="Mobile apps and games by Kostas Papageorgiou.">
<style>
  :root { --bg:#0b1020; --panel:#16213a; --ink:#f2f0e6; --mute:#9fb0cf; --gold:#ffd23f; --edge:#0a0e1a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; justify-content:center; }
  main { width:100%; max-width:720px; padding:48px 16px; }
  h1 { font-size:1.8rem; margin:0 0 .25rem; }
  .sub { color:var(--mute); margin:0 0 2.5rem; }
  .app { background:var(--panel); border:2px solid var(--edge); border-top-color:#34497a; padding:20px; display:flex; gap:16px; align-items:flex-start; }
  .app img { width:72px; height:72px; image-rendering:pixelated; flex:none; border-radius:16px; }
  .app h2 { margin:0; color:var(--gold); font-size:1.25rem; }
  .app p { margin:.35rem 0 .75rem; color:var(--mute); }
  a { color:var(--gold); }
  .links a { margin-right:1.25rem; }
  footer { margin-top:3rem; color:var(--mute); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Kostas Papageorgiou</h1>
  <p class="sub">Mobile apps and games.</p>

  <section class="app">
    <img src="tailwind-aces/icon.png" alt="Tailwind Aces icon">
    <div>
      <h2>Tailwind Aces: Pixel Shooter</h2>
      <p>A retro vertical-scrolling arcade shoot 'em up for Android: 14 stages, 14 giant bosses and 7 planes to fly.</p>
      <div class="links">
        <a href="https://play.google.com/store/apps/details?id=com.kostaspapageorgiou.tailwindaces">Google Play</a>
        <a href="tailwind-aces/privacy.html">Privacy policy</a>
      </div>
    </div>
  </section>

  <footer>Contact: <a href="mailto:kostas.papag@gmail.com">kostas.papag@gmail.com</a></footer>
</main>
</body>
</html>
